<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-box">

        <h2>Welcome back</h2>

        <form>

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Password</label>
            <input type="password" placeholder="Enter your password">

            <button>Login</button>

        </form>

        <p>Don't have an account?
            <a href="#">Sign Up</a>
        </p>

    </div>

</body>
</html>
